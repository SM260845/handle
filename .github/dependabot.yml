version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      lint-format:
        patterns:
          - eslint*
          - '@eslint/*'
          - prettier*
          - typescript-eslint*
      types:
        patterns:
          - '@types/*'
      test:
        patterns:
          - vitest*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
