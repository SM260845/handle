version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Track Node 22 (see .nvmrc / engines). Do not auto-bump @types/node to 23+.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      lint-format:
        patterns:
          - eslint*
          - '@eslint/*'
          - prettier*
          - typescript-eslint*
      types:
        patterns:
          - '@types/*'
      test:
        patterns:
          - vitest*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
